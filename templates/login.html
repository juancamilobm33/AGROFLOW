<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Institución Educativa Cardenal Aníbal Muñoz Duque | Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-panel">
        <div class="auth-brand-header">
          <p class="auth-eyebrow">INSTITUCIÓN EDUCATIVA CARDENAL ANÍBAL MUÑOZ DUQUE</p>
          <img class="institution-crest" src="{{ url_for('static', filename='escudo-iecamd.jpg') }}" alt="Escudo de la Institución Educativa Cardenal Aníbal Muñoz Duque" />
        </div>
        <h1>Una escuela transformadora para la vida</h1>
        <p class="auth-subtitle">Iniciar sesión</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
          <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="post" class="auth-form">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
          <label for="username" class="form-label">Usuario</label>
          <input class="form-control" id="username" name="username" type="text" autocomplete="username" required autofocus />

          <label for="password" class="form-label mt-3">Contraseña</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required />

          <button class="btn btn-success w-100 mt-4" type="submit">Iniciar sesión</button>
        </form>
      </section>
    </main>
  </body>
</html>
